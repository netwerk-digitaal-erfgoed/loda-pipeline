# Metadata for your pipeline:
---
name: teylers
description: Zet de teylers datadump om naar EDM RDF voor publicatie op Europeana

# This is optional, by default it will be stored in the data directory of the pipeline using filename 'statements.nt'
destination: file://teylers.nt

# The individual stages for your pipeline
stages:
  - name: "Stage 1 - edm:ProvidedCHO"
    iterator:
      query: file://iterator.rq
      batchSize: 1000
      endpoint: http://localhost:3030/teylers/sparql
    generator:
      - query: file://edm-generator-providedcho.rq
        batchSize: 1000
  - name: "Stage 2 - ore:Aggregation"
    iterator:
      query: file://iterator.rq
      batchSize: 1000
      endpoint: http://localhost:3030/teylers/sparql
    generator:
      - query: file://edm-generator-aggregation.rq
        batchSize: 1000